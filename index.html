<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e1f">
<meta name="color-scheme" content="dark">
<title>PK Vault</title>
<link rel="icon" id="favicon" href="https://upload.wikimedia.org/wikipedia/commons/9/91/PK_icon.svg">
<link rel="apple-touch-icon" id="touchicon" href="https://upload.wikimedia.org/wikipedia/commons/9/91/PK_icon.svg?width=512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PK Vault">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22PK Vault%22,%22short_name%22:%22PK Vault%22,%22display%22:%22standalone%22,%22background_color%22:%22%23100e1f%22,%22theme_color%22:%22%23100e1f%22,%22start_url%22:%22.%22,%22lang%22:%22it%22,%22icons%22:[{%22src%22:%22https://upload.wikimedia.org/wikipedia/commons/9/91/PK_icon.svg%22,%22sizes%22:%22any%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22}]}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#100e1f;--bg2:#15122a;--surface:#1e1a36;--surface2:#29244a;--line:#352f5a;
 --text:#f2effb;--muted:#a59fc6;--faint:#6f6994;
 --mint:#5cf0b4;--mint-ink:#06291c;--amber:#ffc94a;--amber-ink:#2b1d00;--violet:#a689ff;--rose:#ff8aa5;
 --display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
 --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --cols:3;--amb:122 92 255;
 color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
[hidden]{display:none!important}

/* ---------- Testata ---------- */
.top{padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 0;max-width:1200px;margin:0 auto}
.brandrow{display:flex;align-items:center;gap:12px;min-height:52px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;position:relative;overflow:hidden}
.mark img{width:28px;height:22px;object-fit:contain;position:absolute;opacity:0;transition:opacity .3s}
.mark img.ok{opacity:1}.mark img.ok+span{opacity:0}
.mark span{font-family:var(--display);font-weight:800;font-size:15px;color:var(--amber)}
.appname{font-family:var(--display);font-weight:700;font-size:17px;flex:1}
.acts{display:flex;gap:4px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text);transition:background .15s}
.iconbtn:active{background:var(--surface2)}
.iconbtn.on{color:var(--mint)}
.iconbtn .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--mint);transform:translate(9px,-9px)}
.hero{padding:30px 0 16px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.6vw,44px);line-height:1;letter-spacing:-.02em;margin:0 0 16px}
.progress{display:flex;align-items:center;gap:14px}
.pbar{flex:1;height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#3fd69c,var(--mint));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pnum{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pnum small{font-size:15px;color:var(--faint);font-weight:700}
.statline{display:flex;gap:16px;margin-top:9px;font-size:13px;color:var(--muted)}
.statline b{color:var(--text);font-weight:650}

/* ---------- Dock (ricerca + serie) ---------- */
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:transparent;border-bottom:1px solid transparent;transition:border-color .2s,background .2s}
.dock.stuck{border-bottom-color:var(--line);background:rgba(16,14,31,.86);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.tab{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab:not(.sel){background:rgba(30,26,54,.78)}
.dock-in{max-width:1200px;margin:0 auto}
.searchbar{display:flex;gap:8px;padding:10px 18px 2px}
.searchbar input{flex:1;min-width:0;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;outline:none}
.searchbar input:focus{border-color:var(--mint)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 12px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:18px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;scroll-snap-align:start;height:36px;padding:0 14px;border-radius:99px;background:var(--surface);color:var(--muted);font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:7px;transition:background .15s,color .15s}
.tab small{font-size:11.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.tab.sel{background:var(--text);color:var(--bg)}
.tab.sel small{color:#5b5578}
.tab.done small{color:#2fb37f}

/* ---------- Griglia ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:6px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.resbar{display:flex;justify-content:space-between;align-items:center;min-height:30px;font-size:13px;color:var(--muted);margin-bottom:6px}
.linkbtn{color:var(--mint);font-weight:650;font-size:13px;padding:6px 0}
.grid{--c:var(--cols);display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:18px 10px;align-items:start}
@media(min-width:640px){.grid{--c:calc(var(--cols) + 2);gap:24px 16px}}
@media(min-width:980px){.grid{--c:calc(var(--cols) + 3)}}
.ghead{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin:14px 0 -4px}
.ghead:first-child{margin-top:0}
.ghead h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em}
.ghead span{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.ghead span b{color:var(--mint);font-weight:650}
.card{min-width:0;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;outline:none}
.card:active .cv{transform:scale(.97)}
.cv{position:relative;aspect-ratio:.68;border-radius:10px;overflow:hidden;background:var(--surface);transition:transform .18s,box-shadow .2s;isolation:isolate}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;-webkit-user-drag:none;pointer-events:none}
.cv img.ok{opacity:1}
.cv-fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;background:linear-gradient(160deg,#2a2450,#17142c)}
.cv-fb b{font-family:var(--display);font-weight:800;font-size:clamp(18px,6vw,30px);color:var(--amber);letter-spacing:-.04em}
.cv-fb span{font-size:11px;font-weight:700;color:var(--muted)}
.cv-fb em{font-style:normal;font-size:9.5px;color:var(--faint)}
.badge{position:absolute;right:6px;bottom:6px;z-index:3;width:24px;height:24px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.badge .icon{width:14px;height:14px;stroke-width:3}
.kind{position:absolute;left:6px;top:6px;z-index:3;padding:3px 7px;border-radius:6px;font-size:10px;font-weight:750;background:var(--violet);color:#160b33}
.kind.sp{background:var(--amber);color:var(--amber-ink)}
.card.owned .cv{box-shadow:0 0 0 2px var(--mint)}
.card.chosen .cv{box-shadow:0 0 0 3px var(--amber)}
.choose{position:absolute;left:6px;top:6px;z-index:4;width:24px;height:24px;border-radius:8px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center}
.choose .icon{width:15px;height:15px;stroke-width:3}
.grid.dim .card:not(.owned) .cv img{filter:grayscale(.75) brightness(.55)}
.meta{padding:8px 1px 0}
.num{display:block;font-size:11.5px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.card.owned .num{color:var(--mint)}
.ttl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:13px;font-weight:600;line-height:1.25;margin-top:2px}
.grid[data-cols="4"] .ttl{font-size:11.5px}.grid[data-cols="4"] .badge{width:20px;height:20px}
.grid[data-cols="2"] .ttl{font-size:15px}
.empty{grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--muted)}
.empty h3{font-family:var(--display);color:var(--text);font-size:20px;margin:0 0 6px}
.empty p{margin:0 0 18px;font-size:14px}

/* ---------- Pulsanti ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--surface2);font-weight:700;font-size:14.5px;text-decoration:none;transition:transform .12s,background .15s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.amber{background:var(--amber);color:var(--amber-ink)}
.btn.mint{background:var(--mint);color:var(--mint-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.full{width:100%}
.btn.sm{min-height:40px;font-size:13px;padding:0 13px;border-radius:12px}
.btn:disabled{opacity:.4}

/* ---------- Barra selezione ---------- */
.bulk{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px;border-radius:20px;background:var(--surface2);box-shadow:0 18px 50px rgba(0,0,0,.55);transform:translateY(140%);transition:transform .35s cubic-bezier(.2,.9,.25,1.1)}
.bulk.open{transform:none}
.bulk .count{min-width:56px;text-align:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--amber);line-height:1}
.bulk .count small{display:block;font-family:var(--body);font-size:10px;font-weight:650;color:var(--muted);margin-top:3px}
.bulk .btn{flex:1;min-height:44px;font-size:13px;padding:0 8px}
.bulk .x{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center}

/* ---------- Fogli (filtri, impostazioni) ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(6,5,14,.6);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;display:flex;align-items:flex-end;justify-content:center}
.overlay.open{opacity:1;visibility:visible}
.sheet{width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg2);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.85,.2,1)}
.overlay.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh-head h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0}
.grouplabel{font-size:13px;font-weight:650;color:var(--muted);margin:20px 0 9px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:12px;background:var(--surface);color:var(--muted);font-size:13.5px;font-weight:650}
.chip.sel{background:var(--text);color:var(--bg)}
.note{font-size:13px;line-height:1.5;color:var(--muted);margin:8px 0 0}
.stack{display:grid;gap:9px}
hr.sep{border:0;border-top:1px solid var(--line);margin:22px 0 4px}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:26px}}

/* ---------- Visore albo (swipe) ---------- */
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;opacity:0;transform:scale(.985);transition:opacity .22s,transform .28s cubic-bezier(.2,.85,.2,1)}
.viewer.open{opacity:1;transform:none}
.v-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 62% at 50% 0%,rgb(var(--amb) / .5),rgb(var(--amb) / .12) 52%,transparent 78%);transition:background .6s}
.v-top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 4px}
.v-pos{font-size:13px;font-weight:650;color:var(--text);opacity:.85;font-variant-numeric:tabular-nums}
.v-viewport{position:relative;z-index:2;flex:1;overflow:hidden}
.v-track{display:flex;width:300%;height:100%;transform:translateX(-33.3333%);touch-action:pan-y;will-change:transform}
.v-track.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.pane{flex:0 0 33.3333%;width:33.3333%;height:100%;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px calc(120px + env(safe-area-inset-bottom,0px))}
.pane-in{max-width:560px;margin:0 auto}
.p-cover{width:min(66vw,310px,calc(48dvh * .68));margin:6px auto 0;cursor:zoom-in;position:relative}
.p-cover .cv{border-radius:8px;box-shadow:0 24px 50px rgba(0,0,0,.55);transition:box-shadow .3s,transform .3s}
.p-cover .cv img{object-fit:contain;background:#0c0a18}
.p-cover.owned .cv{box-shadow:0 0 0 3px var(--mint),0 24px 50px rgba(0,0,0,.55)}
.p-cover.pop .cv{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
.p-zoomhint{position:absolute;right:8px;top:8px;z-index:4;width:34px;height:34px;border-radius:10px;background:rgba(16,14,31,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center}
.p-zoomhint .icon{width:17px;height:17px}
.p-head{text-align:center;margin:20px 0 22px}
.p-over{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--muted)}
.p-over .tag{padding:3px 8px;border-radius:7px;background:var(--violet);color:#160b33;font-size:11px;font-weight:750}
.p-over .tag.sp{background:var(--amber);color:var(--amber-ink)}
.p-title{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.4vw,36px);line-height:1.04;letter-spacing:-.02em;margin:8px 0 6px;overflow-wrap:anywhere}
.p-sub{font-size:14px;color:var(--muted)}
.box{background:rgba(30,26,54,.72);border-radius:20px;padding:16px;margin-bottom:12px}
.box h3{font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:block;min-width:0}.field.wide{grid-column:1/-1}
.field span{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:11px 12px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mint)}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 20px,calc(100% - 14px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
details.box summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px}
details.box summary::-webkit-details-marker{display:none}
details.box summary .icon{transition:transform .2s;color:var(--muted)}
details.box[open] summary .icon{transform:rotate(90deg)}
details.box[open] summary{margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btn{flex:1}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.links a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:6px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;font-weight:650;text-decoration:none;text-align:center;color:var(--text)}
.links .icon{width:15px;height:15px}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0}
.v-actions{position:absolute;z-index:4;left:0;right:0;bottom:0;display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(16,14,31,.92) 30%)}
.v-actions .btn{min-height:54px;border-radius:16px;font-size:15px}
.v-actions .own{flex:1.7}
.v-actions .vinted{flex:1;background:var(--surface2)}
.navbtn{position:absolute;z-index:3;top:38%;width:44px;height:44px;border-radius:50%;background:rgba(41,36,74,.85);display:grid;place-items:center}
.navbtn.prev{left:10px}.navbtn.next{right:10px}
.navbtn:disabled{opacity:.25}
@media(pointer:coarse){.navbtn{display:none}}
.swipehint{position:absolute;z-index:5;left:50%;top:44%;transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:rgba(16,14,31,.88);font-size:13px;font-weight:650;white-space:nowrap;pointer-events:none;animation:hint 2.6s ease both}
@keyframes hint{0%{opacity:0}12%{opacity:1;transform:translateX(-50%)}30%{transform:translateX(calc(-50% - 18px))}48%{transform:translateX(calc(-50% + 18px))}62%{transform:translateX(-50%)}85%{opacity:1}100%{opacity:0}}

/* ---------- Zoom copertina ---------- */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(8,6,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 56px) 10px calc(env(safe-area-inset-bottom,0px) + 18px);animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.lb-close{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);width:44px;height:44px;border-radius:14px;background:var(--surface2);display:grid;place-items:center}
.lb-frame{width:min(94vw,680px);max-height:76dvh;aspect-ratio:.68;perspective:1100px;touch-action:none;display:flex;align-items:center;justify-content:center}
.lb-img{display:block;width:100%;height:100%;object-fit:contain;border-radius:4px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .55s cubic-bezier(.17,.78,.2,1),opacity .3s;opacity:0;-webkit-user-drag:none;pointer-events:none}
.lb-img.ok{opacity:1}
.lb-frame.dragging .lb-img{transition:opacity .3s}
.lb-fb{display:none;color:var(--muted)}
.lb-report{font-size:12px;color:var(--muted);text-align:center;max-width:94vw}
.lb-report.low{color:var(--amber)}
.lb-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.lb-row .btn{min-height:38px;font-size:12.5px}

/* ---------- Toast ---------- */
.toast{position:fixed;z-index:90;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);font-weight:650;font-size:13.5px;padding:11px 18px;border-radius:99px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;transition:transform .22s,opacity .22s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- V20 · novità e albi personali ---------- */
.stripe.up{background:linear-gradient(90deg,#5cf0b4,#7ee0ff);color:#062a1d}
.p-over .tag.up{background:var(--mint);color:var(--mint-ink)}
.p-over .tag.mine,.p-over .tag.up{margin-left:4px}
.p-over .tag.mine{background:var(--surface2);color:var(--text)}
.p-over{flex-wrap:wrap;justify-content:center}
.mine{position:absolute;right:6px;bottom:22px;z-index:3;width:20px;height:20px;border-radius:7px;background:var(--surface2);color:var(--text);font-weight:800;font-size:14px;display:grid;place-items:center}
.newsitem{display:block;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none}
.newsitem:last-child{border-bottom:0}
.newsitem b{display:block;font-size:14.5px;font-weight:650;line-height:1.35}
.newsitem small{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.newsitem em{font-style:normal;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--mint);color:var(--mint-ink)}
.newsbox{background:var(--surface);border-radius:16px;padding:2px 14px;margin-top:10px}
.loader{padding:18px 0;color:var(--muted);font-size:13px;text-align:center}
.menudot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--mint);transform:translate(10px,-10px);box-shadow:0 0 8px var(--mint)}
/* ---------- V19 · logo personale ---------- */
.herologo{display:block;max-width:min(78%,360px);max-height:96px;object-fit:contain;object-position:left center;margin:0 0 16px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.55))}
.logoprev{display:flex;align-items:center;justify-content:center;height:96px;border-radius:16px;background:repeating-conic-gradient(#1e1a36 0 25%,#241f40 0 50%) 0 0/18px 18px;margin-top:4px;padding:10px}
.logoprev img{max-width:100%;max-height:100%;object-fit:contain}
.logoprev span{font-size:12px;color:var(--muted)}
.inline-url{display:flex;gap:8px;margin-top:10px}
.inline-url input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:0 12px;font-size:16px;outline:none}
.inline-url input:focus{border-color:var(--mint)}
/* ---------- V18 · tema PK ---------- */
.appbg{position:absolute;left:0;right:0;top:0;height:min(80vh,640px);z-index:0;overflow:hidden;pointer-events:none}

.appbg img.ok{opacity:var(--bgop,.5)}
.appbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,14,31,.55) 0%,rgba(16,14,31,.2) 35%,rgba(16,14,31,.65) 75%,var(--bg) 100%),radial-gradient(90% 60% at 80% 0%,rgba(122,92,255,.25),transparent 70%)}
.top,.wrap{position:relative;z-index:1}
.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#2c2650,#151129);border:1px solid rgba(255,201,74,.25);box-shadow:inset 0 1px rgba(255,255,255,.15),0 6px 18px rgba(0,0,0,.4)}
.mark::after{content:"";position:absolute;bottom:-20px;left:-6px;width:58px;height:34px;background:var(--amber);filter:blur(20px);opacity:.25}
.mark img{width:38px;height:31px;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.pkword{font-family:var(--display);font-style:italic;font-weight:800;color:var(--amber);letter-spacing:-.06em;text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,2px 2px 0 #000;display:inline-block;transform:skewX(-8deg)}
.mark span.pkword{font-size:22px}
.brand{flex:1;min-width:0}
.appname{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;line-height:1}
.appname .pkword{font-size:21px;margin-right:4px}
.tagline{font-size:10px;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);margin-top:5px;text-transform:uppercase}
.hero h1{text-shadow:0 2px 24px rgba(0,0,0,.5)}
.cv-fb b{font-style:italic;transform:skewX(-9deg);text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,2px 2px 0 #000;letter-spacing:-.06em}
.stripe{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:4px 3px;text-align:center;font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.stripe.v{background:linear-gradient(90deg,#b28cff,#e2b2f7);color:#1a0f33}
.stripe.sp{background:linear-gradient(90deg,#ffd35c,#ffad57);color:#2b1d00}
.grid[data-cols="2"] .stripe{font-size:10px;padding:5px}
.card .badge{bottom:auto;top:6px}
.v-bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 55%,transparent 80%);mask-image:linear-gradient(180deg,transparent,#000 12%,#000 55%,transparent 80%)}

.p-chipwrap{text-align:center}
.links button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:6px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;font-weight:650;color:var(--text)}

for(const [o,n] of Object.entries({'PKNA-Speciale 1997':'PKNA-S97','PKNA-Speciale 1998':'PKNA-S98','PKNA-Speciale 1999':'PKNA-S99','PKNA-Speciale 2000':'PKNA-S00','PK²-Speciale 2001':'PK²-Speciale'}))if(entries[o]&&!entries[n])entries[n]=entries[o];

const ENHKEY='pk-vault-enhance';
let enhanceOn=true;try{enhanceOn=localStorage.getItem(ENHKEY)!=='off'}catch(e){}
const DPR=Math.min(3,Math.max(1,window.devicePixelRatio||1));
function enhancedUrl(src,cssW,sharp=1){
 if(!enhanceOn||!src||!/^https?:\/\//i.test(src)||/wsrv\.nl/.test(src))return src;
 const w=Math.min(1800,Math.round(cssW*DPR/10)*10);
 return 'https://wsrv.nl/?url='+encodeURIComponent(src)+'&w='+w+'&fit=inside&sharp='+sharp+'&sharpf=1&sharpj=2&q=88&output=webp&il';
}
function cleanImageUrl(u){u=(u||'').trim();if(!u)return '';try{const x=new URL(u);const p=x.searchParams.get('imgurl')||x.searchParams.get('mediaurl')||x.searchParams.get('url');if(p&&/^https?:/i.test(p)&&/google\.|bing\./.test(x.hostname))return p}catch(e){}return u}
const coverSrc=i=>{const r=row(i.id);return r.customCover||r.cover||i.image||''};
const q=i=>`${i.label} ${i.number} ${i.title} copertina`;
const googleHD=i=>'https://www.google.com/search?tbm=isch&tbs=isz:l&q='+encodeURIComponent(q(i));
const bingHD=i=>'https://www.bing.com/images/search?qft=+filterui:imagesize-large&q='+encodeURIComponent(q(i));
function vintedQuery(i,broad){
 if(i.vintedQuery)return broad?i.vintedQuery.split(' ').slice(0,3).join(' '):i.vintedQuery;
 if(['PKNA','PK²','Pikappa'].includes(i.series)){const stem=i.series==='PK²'?'PK2':i.series;const n=i.kind==='special'?'Speciale '+i.year:i.number;return broad?`${stem} ${n}`:`${stem} ${n} ${i.title}`}
 return broad?`PK ${i.number}`:`PK ${i.number} ${i.title} ${i.edition||''}`;
}
const vintedUrl=(i,b)=>'https://www.vinted.it/catalog?search_text='+encodeURIComponent(vintedQuery(i,b));
const numLabel=i=>i.kind==='special'?'Speciale '+i.number:i.kind==='variant'?'Variant '+i.number.replace(/\s*V\d*$/,''):'#'+i.number;

function cover(i,mode){
 const src=coverSrc(i);const detail=mode==='detail';
 const cols=+prefs.density||3;const cssW=detail?310:Math.max(110,(Math.min(innerWidth,1200)-36)/cols);
 const url=src?enhancedUrl(src,cssW,detail?1.2:0.9):'';
 const cors=detail&&url&&url!==src?' crossorigin="anonymous"':'';
 return `<div class="cv"><div class="cv-fb"><b>PK</b><span>${esc(i.kind==='special'?'Speciale':'#'+i.number)}</span><em>${src?'':'Copertina da aggiungere'}</em></div>${src?`<img${cors} loading="${detail?'eager':'lazy'}" decoding="async" alt="" data-orig="${esc(src)}"${i.alt&&!row(i.id).customCover?` data-alt="${esc(i.alt.join('|'))}"`:''} src="${esc(url)}">`:''}</div>`;
}
function bindImages(root){
 root.querySelectorAll('.cv img').forEach(img=>{
  const ok=()=>img.classList.add('ok');
  const fail=()=>{const o=img.dataset.orig;img.removeAttribute('crossorigin');
   if(o&&img.getAttribute('src')!==o&&!img.dataset.tried){img.dataset.tried='1';img.addEventListener('error',fail,{once:true});img.addEventListener('load',ok,{once:true});img.src=o;return}
   const alts=(img.dataset.alt||'').split('|').filter(Boolean);if(alts.length){const nx=alts.shift();img.dataset.alt=alts.join('|');img.dataset.orig=nx;img.addEventListener('error',fail,{once:true});img.addEventListener('load',ok,{once:true});img.src=nx;return}
   img.remove()};
  if(img.complete&&img.naturalWidth){ok();return}
  if(img.complete&&!img.naturalWidth&&img.getAttribute('src')){fail();return}
  img.addEventListener('load',ok,{once:true});img.addEventListener('error',fail,{once:true});
 });
}

function bgSource(){
 if(bgp.mode==='none')return {src:'',label:'Nessuno'};
 if(bgp.mode==='url'&&bgp.url)return {src:bgp.url,label:'Immagine da link'};
 if(bgp.mode==='photo'){let d='';try{d=localStorage.getItem(BGPHOTO)||''}catch(e){}if(d)return {src:d,label:'La tua foto'}}

/* ---------- Elenco filtrato ---------- */
function shown(){
 const s=prefs.search.toLocaleLowerCase('it');
 let arr=catalog.filter(i=>(prefs.series==='Tutte'||i.series===prefs.series)
  &&(prefs.owned==='Tutti'||(prefs.owned==='Posseduti'?!!row(i.id).owned:!row(i.id).owned))
  &&(prefs.type==='Tutti'||(prefs.type==='Speciali'?i.kind==='special':prefs.type==='Variant'?i.kind==='variant':i.kind==='regular'))
  &&(prefs.cover!=='mancanti'||!coverSrc(i))
  &&(!s||(i.label+' '+i.number+' '+i.title+' '+i.year+' '+i.series).toLocaleLowerCase('it').includes(s)));
 if(prefs.sort==='serie'){const ix=new Map(SERIES.map((v,k)=>[v,k]));arr=arr.map((x,k)=>[x,k]).sort((a,b)=>(ix.get(a[0].series)-ix.get(b[0].series))||a[1]-b[1]).map(x=>x[0])}
 if(prefs.sort==='titolo')arr.sort((a,b)=>a.title.localeCompare(b.title,'it'));
 if(prefs.sort==='anno')arr.sort((a,b)=>a.year-b.year);
 if(prefs.sort==='mancanti')arr.sort((a,b)=>Number(!!row(a.id).owned)-Number(!!row(b.id).owned));
 if(prefs.sort==='posseduti')arr.sort((a,b)=>Number(!!row(b.id).owned)-Number(!!row(a.id).owned));
 return arr;
}
const stats=name=>{const all=name==='Tutte'?catalog:catalog.filter(i=>i.series===name);return {total:all.length,owned:all.filter(i=>row(i.id).owned).length}};
const filtersActive=()=>prefs.owned!=='Tutti'||prefs.type!=='Tutti'||prefs.sort!=='serie'||prefs.cover!=='tutte';
const parseEuro=v=>{const n=parseFloat(String(v||'').replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.'));return isFinite(n)?n:0};

 $('spentWrap').hidden=!spent;$('spentN').textContent=spent.toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:spent%1?2:0});
}
function renderTabs(){

function cardHTML(i,showLabel){

function render(){

  if(grouped&&i.series!==last){last=i.series;const st=stats(i.series);html+=`<div class="ghead"><h2>${esc(i.series)}</h2><span><b>${st.owned}</b> / ${st.total}</span></div>`}

 if(!items.length)$('resetEmpty').onclick=resetFilters;

function resetFilters(){prefs={...prefs,owned:'Tutti',type:'Tutti',sort:'serie',cover:'tutte',search:''};$('search').value='';render()}

function setAmbient(img){
 try{const c=document.createElement('canvas');c.width=12;c.height=16;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,12,16);const d=x.getImageData(0,0,12,16).data;let r=0,g=0,b=0,w=0;
  for(let k=0;k<d.length;k+=4){const mx=Math.max(d[k],d[k+1],d[k+2]),mn=Math.min(d[k],d[k+1],d[k+2]);const wt=1+(mx-mn)/40;r+=d[k]*wt;g+=d[k+1]*wt;b+=d[k+2]*wt;w+=wt}
  r/=w;g/=w;b/=w;const L=Math.max(r,g,b)||1;const k2=Math.min(1.6,190/L);viewer.style.setProperty('--amb',`${Math.round(r*k2)} ${Math.round(g*k2)} ${Math.round(b*k2)}`)}catch(e){viewer.style.setProperty('--amb','122 92 255')}
}

 panes.forEach(p=>{p.scrollTop=0;bindImages(p)});

 $('vPos').textContent=`${vIndex+1} di ${vList.length}`;$('vPrev').disabled=!prev;$('vNext').disabled=!next;

}

 if(!remote||!Array.isArray(remote.items))return [];
 const ign=new Set(ignored()),known=new Set(catalog.map(i=>norm(i.title)+'|'+norm(i.number)));
 return remote.items.filter(c=>c&&c.id&&c.title&&!ign.has(c.id)&&!byId.has(c.id)&&!known.has(norm(c.title)+'|'+norm(c.number)));
}
async function loadRemote(){
 if(!/^https?:/.test(location.protocol))return;
 try{const r=await fetch('upcoming.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(j&&typeof j==='object'){remote=j;if(candidates().length)$('menuDot').hidden=false}}catch(e){}
}
function candidatesHTML(){
 const c=candidates();if(!c.length)return '';
 return `<div class="grouplabel">Trovate in automatico <span style="color:var(--mint)">${c.length}</span></div><div class="newsbox">${c.slice(0,20).map(x=>`<div class="newsitem" style="display:flex;gap:12px;align-items:center">${x.image?`<img src="${esc(x.image)}" alt="" style="width:46px;height:64px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--surface2)" onerror="this.style.visibility='hidden'">`:''}<div style="flex:1;min-width:0"><b>${esc(x.title)}</b><small>${esc(x.where||x.series||'')}${x.date?' · '+esc(x.date):''}${x.upcoming?' · <em>In uscita</em>':''}</small><div class="row" style="margin-top:8px"><button class="btn sm mint" data-cadd="${esc(x.id)}">Aggiungi</button><button class="btn sm ghost" data-cign="${esc(x.id)}">Ignora</button>${x.source?`<a class="btn sm ghost" href="${esc(x.source)}" target="_blank" rel="noopener noreferrer">Apri</a>`:''}</div></div></div>`).join('')}</div>`;
}
function bindCandidates(){
 $('sheetBody').querySelectorAll('[data-cadd]').forEach(b=>b.onclick=()=>{const x=candidates().find(c=>c.id===b.dataset.cadd);if(x)addSheet({...x,remoteId:x.id})});
 $('sheetBody').querySelectorAll('[data-cign]').forEach(b=>b.onclick=()=>{const l=ignored();l.push(b.dataset.cign);try{localStorage.setItem(IGNKEY,JSON.stringify(l))}catch(e){}const card=b.closest('.newsitem');card?.remove();toast('Ignorata')});
}

/* ---------- Aggiungi un albo ---------- */
function addSheet(pre={}){
 const opts=SERIES.map(v=>`<option ${prefs.series===v?'selected':''}>${esc(v)}</option>`).join('');
 openSheet(head('Aggiungi albo')+`<p class="note" style="margin-top:0">Per le nuove uscite non ancora in catalogo. Resta solo sul tuo dispositivo ed entra nel backup.</p>
 <div class="fields" style="margin-top:14px">
  <label class="field wide"><span>Serie</span><select id="aSeries">${opts}<option value="__new">Nuova serie…</option></select></label>
  <label class="field wide" id="aNewWrap" hidden><span>Nome nuova serie</span><input id="aNew" placeholder="Es. PK 2027"></label>
  <label class="field"><span>Numero</span><input id="aNum" placeholder="Es. 121"></label>
  <label class="field"><span>Anno</span><input id="aYear" inputmode="numeric" value="${new Date().getFullYear()}"></label>
  <label class="field wide"><span>Titolo</span><input id="aTitle" placeholder="Titolo della storia"></label>
  <label class="field"><span>Tipo</span><select id="aKind"><option value="regular">Regolare</option><option value="variant">Variant</option><option value="special">Speciale</option></select></label>
  <label class="field"><span>Testata</span><input id="aEd" placeholder="Topolino, Paperinik…"></label>
  <label class="field wide"><span>Link copertina (facoltativo)</span><input id="aImg" type="url" placeholder="https://…"></label>
  <label class="field wide" style="display:flex;align-items:center;gap:10px"><input id="aUp" type="checkbox" style="width:22px;min-height:22px;height:22px;accent-color:var(--mint)"><span style="margin:0">Non ancora uscito (in uscita)</span></label>
 </div>
 <div class="row" style="margin-top:18px"><button class="btn ghost" data-close>Annulla</button><button class="btn amber" style="flex:2" id="aSave">Aggiungi</button></div>`);
 $('aSeries').onchange=e=>{$('aNewWrap').hidden=e.target.value!=='__new'};
 if(pre.title){if(pre.series&&SERIES.includes(pre.series))$('aSeries').value=pre.series;else if(pre.series){$('aSeries').value='__new';$('aNewWrap').hidden=false;$('aNew').value=pre.series}
  $('aNum').value=pre.number||'';$('aTitle').value=pre.title||'';$('aYear').value=pre.year||new Date().getFullYear();$('aKind').value=['regular','variant','special'].includes(pre.kind)?pre.kind:'regular';$('aEd').value=pre.edition||pre.where||'';$('aImg').value=pre.image||'';$('aUp').checked=!!pre.upcoming}
 $('aSave').onclick=()=>{
  const series=$('aSeries').value==='__new'?$('aNew').value.trim():$('aSeries').value;const title=$('aTitle').value.trim(),number=$('aNum').value.trim();
  if(!series||!title||!number){toast('Servono serie, numero e titolo');return}
  const img=cleanImageUrl($('aImg').value);if(img&&!/^https?:\/\//i.test(img)){toast('Il link copertina deve iniziare con https://');return}
  const item={id:'CUSTOM-'+Date.now().toString(36),series,number,title,year:parseInt($('aYear').value,10)||new Date().getFullYear(),kind:$('aKind').value,image:img,source:'https://www.google.com/search?q='+encodeURIComponent('PK '+number+' '+title),label:series,edition:$('aEd').value.trim()||'Aggiunto da te',...($('aUp').checked?{upcoming:true}:{})};
  if(pre.source)item.source=pre.source;if(pre.remoteId){const l=ignored();l.push(pre.remoteId);try{localStorage.setItem(IGNKEY,JSON.stringify(l))}catch(e){}}
  customItems.push(item);saveCustom();const it={...item,custom:true};catalog.push(it);byId.set(it.id,it);refreshSeries();
  backLayer();prefs.series=series;render();toast('Albo aggiunto');setTimeout(()=>openViewer(it.id),350);
 };
}

/* ---------- Export / import ---------- */
function download(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function downloadHTML(){const payload=JSON.stringify(entries).replace(/<\//g,'<\\/');const text=PRISTINE.replace(/const EMBEDDED_DATA=[\s\S]*?;\s*const KEY=/,()=>'const EMBEDDED_DATA='+payload+';\nconst KEY=');download('PK_Vault_mia_collezione.html',new Blob([text],{type:'text/html;charset=utf-8'}));toast('File HTML pronto')}
function downloadBackup(){download('pk-vault-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify({app:'PK Vault',version:17,exportedAt:new Date().toISOString(),data:entries,custom:customItems},null,2)],{type:'application/json'}));toast('Backup pronto')}
function downloadCSV(){const cols=['Serie','Numero','Titolo','Anno','Posseduto','Condizioni','Prezzo pagato','Data acquisto','Dove','Note'];const c=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const lines=[cols,...catalog.map(i=>{const r=row(i.id);return [i.series,i.number,i.title,i.year,r.owned?'Sì':'No',r.condition||'',r.price||'',r.date||'',r.store||'',r.notes||'']})];download('pk-vault-collezione.csv',new Blob(['\ufeff'+lines.map(l=>l.map(c).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));toast('CSV pronto')}
$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const j=JSON.parse(await f.text());const rows=j.data||j;if(!rows||typeof rows!=='object'||Array.isArray(rows))throw new Error('formato non riconosciuto');if(!confirm('Sostituire la collezione attuale con questo backup?'))return;entries=rows;if(Array.isArray(j.custom)){for(const c of customItems){const k=catalog.findIndex(x=>x.id===c.id);if(k>=0)catalog.splice(k,1);byId.delete(c.id)}customItems=j.custom.filter(x=>x&&x.id&&x.series&&x.title);for(const c of customItems){const it={...c,custom:true};catalog.push(it);byId.set(it.id,it)}saveCustom();refreshSeries()}persist();selected.clear();selectMode=false;render();backLayer();toast('Backup importato')}catch(err){toast('Backup non valido: '+err.message)}finally{e.target.value=''}});
async function resizedPng(file,maxW){const data=await new Promise((y,n)=>{const r=new FileReader;r.onload=()=>y(r.result);r.onerror=n;r.readAsDataURL(file)});const im=await new Promise((y,n)=>{const el=new Image;el.onload=()=>y(el);el.onerror=n;el.src=data});const c=document.createElement('canvas'),s=Math.min(1,maxW/im.naturalWidth);c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/png')}
async function resized(file,maxW=1800,qual=.9){const data=await new Promise((y,n)=>{const r=new FileReader;r.onload=()=>y(r.result);r.onerror=n;r.readAsDataURL(file)});const im=await new Promise((y,n)=>{const el=new Image;el.onload=()=>y(el);el.onerror=n;el.src=data});const c=document.createElement('canvas'),s=Math.min(1,maxW/im.naturalWidth);c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',qual)}

/* ---------- Griglia: tocco, pressione lunga, selezione ---------- */
function syncSelection(){
 for(const card of $('grid').querySelectorAll('.card')){const ch=selected.has(card.dataset.id);card.classList.toggle('chosen',ch);let m=card.querySelector('.choose');if(ch&&!m){card.querySelector('.cv-holder').insertAdjacentHTML('beforeend',`<span class="choose">${icon('check')}</span>`)}else if(!ch&&m){m.remove()}}
 $('bulkBar').classList.toggle('open',selectMode);$('bulkCount').textContent=selected.size;$('bulkOwn').disabled=$('bulkMiss').disabled=!selected.size;
}
let lp=null,lpTimer=null,skipClick=false;
const stopLP=()=>{clearTimeout(lpTimer);lp=null};
$('grid').addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c||e.button>0)return;stopLP();skipClick=false;lp={id:c.dataset.id,x:e.clientX,y:e.clientY,p:e.pointerId};lpTimer=setTimeout(()=>{if(!lp)return;selectMode=true;selected.add(lp.id);skipClick=true;buzz(18);syncSelection()},500)},{passive:true});
$('grid').addEventListener('pointermove',e=>{if(lp&&e.pointerId===lp.p&&(Math.abs(e.clientX-lp.x)>10||Math.abs(e.clientY-lp.y)>10))stopLP()},{passive:true});
for(const ev of ['pointerup','pointercancel','pointerleave'])$('grid').addEventListener(ev,stopLP,{passive:true});
$('grid').addEventListener('contextmenu',e=>{const c=e.target.closest('.card');if(!c)return;e.preventDefault();stopLP();selectMode=true;selected.add(c.dataset.id);skipClick=true;syncSelection()});
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;if(skipClick){skipClick=false;return}if(selectMode){selected.has(c.dataset.id)?selected.delete(c.dataset.id):selected.add(c.dataset.id);syncSelection()}else openViewer(c.dataset.id)});
$('grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();selectMode?(selected.has(e.target.dataset.id)?selected.delete(e.target.dataset.id):selected.add(e.target.dataset.id),syncSelection()):openViewer(e.target.dataset.id)}});
function bulk(own){if(!selected.size)return;const now=Date.now();for(const id of selected)entries[id]={...row(id),owned:own,...(own?{ownedAt:now}:{})};const n=selected.size;persist();selected.clear();selectMode=false;render();toast(`${n} albi segnati come ${own?'posseduti':'mancanti'}`)}
$('bulkOwn').onclick=()=>bulk(true);$('bulkMiss').onclick=()=>bulk(false);$('bulkCancel').onclick=()=>{selected.clear();selectMode=false;render()};

/* ---------- Testata, schede serie, ricerca ---------- */
$('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;prefs.series=t.dataset.series;render();const sel=$('tabs').querySelector('.tab.sel');sel?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});const dockTop=$('dock').getBoundingClientRect().top+scrollY-(parseFloat(getComputedStyle($('dock')).top)||0);if(scrollY>dockTop)scrollTo({top:dockTop})});
$('filterBtn').onclick=filterSheet;$('menuBtn').onclick=settingsSheet;$('clearFilters').onclick=resetFilters;
$('searchBtn').onclick=()=>{const b=$('searchbar');b.hidden=!b.hidden;$('searchBtn').classList.toggle('on',!b.hidden);if(!b.hidden)$('search').focus();else{$('search').value='';prefs.search='';render()}};
$('closeSearch').onclick=()=>$('searchBtn').click();
$('search').oninput=e=>{prefs.search=e.target.value.trim();render()};
$('search').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
new IntersectionObserver(([en])=>$('dock').classList.toggle('stuck',en.intersectionRatio<1),{threshold:[1],rootMargin:'-1px 0px 0px 0px'}).observe($('dock'));
window.addEventListener('keydown',e=>{
 if(e.target.matches?.('input,textarea,select'))return;
 if(e.key==='Escape'){if(layers.length)backLayer();else if(selectMode){selected.clear();selectMode=false;render()}else if(!$('searchbar').hidden)$('closeSearch').click()}
 if(viewer.classList.contains('open')&&!$('lightbox')){if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)}
});
let rT=null;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(!viewer.classList.contains('open'))render()},250)});

persist(true);render();applyBg();applyLogo();setTimeout(backgroundNewsCheck,2500);loadRemote();
</script>
